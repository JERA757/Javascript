<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario 6</title>
    <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>
</head>
<body>
    <h4>Comentarios</h4>

    <form>
        <p>
            <textarea name="areaDeTexto" id="comentarios" rows="10" cols="30">

            </textarea> 
            <br><br>

            <input type="button" value="Enviar" onclick="comentar()">
        </p>
    </form>

    <script>

        let area = document.getElementById('comentarios');

        // Deja el tamaño de forma estática:   
        area.style.resize = 'none';     

        function comentar(){

            if (document.getElementById('comentarios').value.length > 100) {

                swal("¡Comentario demasiado largo! Por favor, " 
                  + "escribe un comentario de menos de 100 caracteres.");

            }  else {

                swal('¡Gracias!');

            }
        }
    </script>

</body>
</html>
