<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Propiedades de pantalla y ventana</title>
</head>
<body>
    
    <h4>Propiedades de la ventana:</h4> 

    <script>

        /* 
         * Altura disponible de la pantalla (Sin la barra de herramientas
         * del navegador) 
        */
       document.write('availHeight: ' + screen.availHeight + '<br>');

       // Anchura máxima disponible de la pantalla: 
       document.write('availWidth: ' + screen.availWidth + '<br>');

       // Nº de bytes por píxel en pantalla:
       document.write('pixelDepth: ' + screen.pixelDepth + '<br>');

    </script>

    <br><br>
    <h4>Propiedades del navegador: </h4>

    <script>

        // Nombre del servidor: 
        document.write('appName: ' + navigator.appName + '<br>');

        // Versión del navegador más el sistema operativo:
        document.write('appVersion: ' + navigator.appVersion + '<br>');

        // Disponibilidad de Cookies para terceros:
        document.write('cookieEnabled: ' + navigator.cookieEnabled + '<br>');

        // Cantidad de plugins (complementos) instalados en el navegador:
        document.write('plugins: ' + navigator.plugins.length + '<br>');

    </script>
    
</body>
</html>
