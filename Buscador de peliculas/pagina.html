<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador de películas</title>
    <link rel="stylesheet" type="text/css" href="misestilos.css">
    <!-- <script src="https://cdm.jsdelivr.net/npm/sweetalert2@11"></script> -->
</head>
<body>
    
    <h1>Buscador</h1> 

    <hr>

    <div class="bloque">

        Seleccione una opción: 
        <select name="selector" id="miSelector">

            <option value="peliculas.json">Películas</option>

            <option value="series.json">Series</option>

        </select>

    </div> 

    <div class="bloque">

        <input type="text" id="miEntrada" placeholder="Ingrese búsqueda...">

        <button id="miBoton">Buscar</button>

    </div>

    <div class="bloque">

        <ul id="miListado"></ul>

    </div>

</body>

<script src="miScript.js"></script>

</html>
