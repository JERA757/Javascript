<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Primer formulario</title>
</head>
<body>
    <!-- Botones en JavaScript: -->
    <h4>Botones de incremento:</h4>
    <form>
        <input type="button" value="Incrementar" onclick="incrementar()"> 
    </form>
    <script>
        let contador = 0;
        function incrementar() {
            contador++;
            alert("Contador: " + contador);
        }
    </script>
</body>
</html>
