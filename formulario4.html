<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario 4</title>
    <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>
</head>
<body>
    <h4>¿Qué lenguajes de programación conoces?</h4>

    <form>
        <input type="checkbox" name="selector" id="chequeo1"> C <br>
        <input type="checkbox" name="selector" id="chequeo2"> C++ <br>
        <input type="checkbox" name="selector" id="chequeo3"> C# <br>
        <input type="checkbox" name="selector" id="chequeo4"> Java <br>
        <input type="checkbox" name="selector" id="chequeo5"> JavaScript <br>
        <input type="checkbox" name="selector" id="chequeo6"> Python <br>
        <br><br>
        <input type="button" value="Confirmar" onclick="seleccionar()">
    </form>

    <script>
        function seleccionar(){

            let cantidad = 0; 

            if (document.getElementById('chequeo1').checked){
                cantidad++;
            }
            if (document.getElementById('chequeo2').checked){
                cantidad++;
            }
            if (document.getElementById('chequeo3').checked){
                cantidad++;
            }
            if (document.getElementById('chequeo4').checked){
                cantidad++;
            }
            if (document.getElementById('chequeo5').checked){
                cantidad++;
            }
            if (document.getElementById('chequeo6').checked){
                cantidad++;
            }

            if (cantidad == 1){

                swal('La cantidad es ' + cantidad + 
                    ' lenguaje de programación conocido.');

            } else{

                swal('La cantidad es ' + cantidad + 
                   ' lenguajes de programación conocidos.');

            }
        }
    </script>
</body>
</html>
