<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>

        // Variables de entrada y de operadores aritméticos:
        let valor1, valor2; 
        let suma, resta, multiplicacion, division, residuo, potencia; 
        
        // Entrada de datos:
        valor1 = parseInt(prompt("Ingrese el primer valor: "));
        valor2 = parseInt(prompt("Ingrese el segundo valor: "));

        // Operadores aritméticos:
        suma = valor1 + valor2;
        resta = valor1 - valor2;
        multiplicacion = valor1 * valor2;
        division = valor1 / valor2;
        residuo = valor1 % valor2;
        potencia = valor1 ** valor2;

        // Salida por pantalla:
        document.write("El resultado de la suma es: ", suma, '<br>');
        document.write("El resultado de la resta es: ", resta, '<br>');
        document.write("El resultado de la multiplicación es: ", multiplicacion, '<br>');
        document.write("El resultado de la división es: ", division, '<br>');
        document.write("El resultado del residuo es: ", residuo, '<br>');
        document.write("El resultado de la potencia es: ", potencia, '<br>');

    </script>
</body>
</html>
